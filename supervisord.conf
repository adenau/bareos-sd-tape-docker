[unix_http_server]
file=/run/tape-webhook/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/tape-webhook/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/tape-webhook/supervisord.pid

[program:bareos-sd]
command=/usr/sbin/bareos-sd -f -d %(ENV_BAREOS_DEBUG_LEVEL)s
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:webhook]
command=/usr/bin/webhook -hooks /run/tape-webhook/hooks.json -ip %(ENV_TAPE_WEBHOOK_LISTEN_ADDRESS)s -port %(ENV_TAPE_WEBHOOK_PORT)s
autostart=%(ENV_TAPE_WEBHOOK_ENABLED)s
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
